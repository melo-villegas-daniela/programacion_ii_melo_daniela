<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear categoría</title>
</head>
<body>
    <h1>Biblioteca</h1>
    <h2>Registrar categoría</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <p>
            <button type="submit">
                Guardar categoría
            </button>
            <a href="{% url 'categoria_list' %}">
                Cancelar
            </a>
        </p>
    </form>
</body>
</html>
