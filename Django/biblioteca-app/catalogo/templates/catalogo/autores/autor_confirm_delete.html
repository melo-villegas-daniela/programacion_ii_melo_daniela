<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar eliminación</title>
</head>
<body>
    <h1>Confirmar eliminación</h1>
    <p>¿Estás seguro de que quieres eliminar al autor "{{ autor.nombre }}" "{{ autor.apellido }}"?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Eliminar</button>
        <a href="{% url 'autor_list' %}">Cancelar</a>
    </form>
</body>
</html>
