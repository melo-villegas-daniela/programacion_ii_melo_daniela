<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% if form.instance.pk %}Editar Autor{% else %}Crear Autor{% endif %}</title>
</head>
<body>
    <h1>Biblioteca</h1>
    <h2>{% if form.instance.pk %}Editar Autor{% else %}Crear Autor{% endif %}</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <p>
            <button type="submit">
                Guardar Autor
            </button>
            <a href="{% url 'autor_list' %}">
                Cancelar
            </a>
        </p>
    </form>
</body>
</html>
