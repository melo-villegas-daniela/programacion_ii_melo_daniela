<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Eliminacion</title>
</head>
<body>
    <h1>Confirmar Eliminacion</h1>
    <p>¿Estas seguro de que quieres eliminar el libro "{{ libro.titulo }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Eliminar</button>
        <a href="{% url 'libro_list' %}">Cancelar</a>
    </form>
</body>
</html>
